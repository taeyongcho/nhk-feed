# 서명된 릴리스 APK(선택: AAB) 빌드 → 아티팩트 업로드 → GitHub Release 생성
# 복사 위치: <안드로이드 repo>/.github/workflows/android-release.yml
#
# 실행 방법
#   1) 태그 푸시:  git tag v1.0.0 && git push origin v1.0.0
#   2) 수동 실행:  Actions 탭 → Android Release → Run workflow
#
# 필요한 Secrets (repo Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64    : 키스토어(.jks)를 base64로 인코딩한 문자열
#   ANDROID_KEYSTORE_PASSWORD  : 키스토어 비밀번호
#   ANDROID_KEY_ALIAS          : 키 별칭
#   ANDROID_KEY_PASSWORD       : 키 비밀번호
name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Play Store 업로드용 AAB도 함께 빌드"
        type: boolean
        default: false

# 릴리스는 도중에 끊기면 안 되므로 취소하지 않음
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release 생성에 필요

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 키스토어는 RUNNER_TEMP에만 풀어놓고 마지막에 지움 (작업 디렉터리에 두지 않음)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 등록되어 있지 않습니다."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build signed AAB
        if: inputs.build_aab
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 서명이 실제로 붙었는지 확인 — 서명 없는 APK가 릴리스에 올라가는 사고 방지
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      # 태그로 실행된 경우에만 GitHub Release를 만들고 APK를 첨부
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/release.jks"
