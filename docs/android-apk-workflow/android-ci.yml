# 안드로이드 네이티브 앱 CI — 디버그 APK 빌드 + 테스트 + 린트
# 복사 위치: <안드로이드 repo>/.github/workflows/android-ci.yml
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 같은 브랜치에서 새 커밋이 오면 이전 실행은 취소 (CI는 최신 것만 의미 있음)
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # gradlew 바이너리가 변조되지 않았는지 검증 (공급망 보안)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Gradle 배포판·의존성·빌드 캐시를 자동으로 캐싱해줌
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 실패했을 때 원인 파악용 리포트 (테스트 결과 HTML, 린트 결과)
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
